# Local single-instance Baby Buddy (SQLite via LinuxServer /config volume).
# No app source changes. Stock image; data stays on a dedicated host volume.
services:
  babybuddy:
    image: lscr.io/linuxserver/babybuddy:latest
    container_name: babybuddy-local
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
    volumes:
      - ${BB_CONFIG_DIR:-./data}:/config
    ports:
      - "${BB_HOST_PORT:-8000}:8000"
    restart: unless-stopped
